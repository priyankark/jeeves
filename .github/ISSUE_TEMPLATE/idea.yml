name: An idea for Jeeves
description: Suggest an improvement or a workflow you would find useful.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to get done?
      description: A concrete example helps more than a feature name.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Where does the current process get awkward?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
    validations:
      required: true
