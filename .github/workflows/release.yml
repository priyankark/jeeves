name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  installers:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check release version and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run package:installer
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Check packaged desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:packaged
      - name: Check packaged desktop on Mac and Windows
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/installers/*.dmg
            release/installers/*.exe
            release/installers/*.AppImage
            release/installers/*.deb
            release/installers/*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/packaged-smoke-*
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify all downloads and collect checksums
        run: node scripts/verify-release-assets.mjs
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/jeeves-release-draft; then
            test "$(cat /tmp/jeeves-release-draft)" = true || { echo "Refusing to replace a published release"; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "Jeeves $RELEASE_TAG — desktop preview" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
